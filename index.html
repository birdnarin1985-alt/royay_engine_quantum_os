<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Engineer Quantum OS - Supreme Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;500;700;900&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; font-family: 'Sarabun', sans-serif; background-color: #000; overflow: hidden; color: #fff; perspective: 1000px; }

        /* พื้นหลังตาข่ายพระอินทร์ */
        #quantumNet { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        /* แสงแฟลชควอนตัม */
        #quantumFlash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,255,136,0.8) 0%, rgba(0,0,0,0) 80%);
            opacity: 0; pointer-events: none; z-index: 3;
            transition: opacity 0.2s ease-out;
        }

        /* วิหารแก้ว UI */
        .crystal-matrix {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 10; background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 255, 136, 0.3); border-radius: 24px;
            padding: 50px 40px; text-align: center;
            box-shadow: 0 0 50px rgba(0, 255, 136, 0.15), inset 0 0 30px rgba(255, 255, 255, 0.05);
            width: 92%; max-width: 700px;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .crystal-matrix.warp-active {
            transform: translate(-50%, -50%) scale(1.05);
            box-shadow: 0 0 100px rgba(0, 255, 136, 0.5), inset 0 0 50px rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(0, 255, 136, 0.8);
        }

        .glitch-title {
            font-size: 3rem; font-weight: 900; letter-spacing: 2px;
            background: linear-gradient(90deg, #fff, #00ff88, #00bfff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 5px; text-shadow: 0 0 30px rgba(0, 255, 136, 0.6);
            animation: pulseText 2s infinite alternate;
        }

        @keyframes pulseText {
            0% { text-shadow: 0 0 20px rgba(0, 255, 136, 0.4); }
            100% { text-shadow: 0 0 40px rgba(0, 255, 136, 0.8), 0 0 10px #fff; }
        }

        .subtitle { font-size: 1.2rem; color: #b3e6cc; margin-bottom: 35px; font-weight: 300; letter-spacing: 1px; }

        .dashboard {
            display: flex; justify-content: space-around; background: rgba(0, 20, 10, 0.6);
            padding: 20px; border-radius: 12px; border: 1px solid rgba(0, 255, 136, 0.2);
            margin-bottom: 40px; box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        .dash-item { display: flex; flex-direction: column; }
        .dash-label { font-size: 0.75rem; color: #00bfff; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; }
        .dash-value { font-size: 1.4rem; font-weight: 700; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.5); }

        .btn-core {
            position: relative; overflow: hidden;
            background: linear-gradient(45deg, #00ff88, #00bfff); border: none;
            padding: 18px 45px; font-size: 1.5rem; font-weight: 900; color: #000;
            border-radius: 50px; cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.5); font-family: 'Sarabun', sans-serif;
            text-transform: uppercase; letter-spacing: 1px;
        }

        .btn-core:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 0 60px rgba(0, 255, 136, 0.8), 0 0 20px #fff;
        }

        .mantra { margin-top: 35px; font-size: 1.1rem; color: #e2e8f0; line-height: 1.8; font-weight: 300; }
        .mantra span { color: #00ff88; font-weight: 700; font-size: 1.2rem; text-shadow: 0 0 10px rgba(0,255,136,0.4); }
        .signature { margin-top: 15px; font-size: 0.9rem; color: #00bfff; font-weight: 500; }

    </style>
</head>
<body>

    <div id="quantumFlash"></div>
    <canvas id="quantumNet"></canvas>

    <div class="crystal-matrix" id="uiMatrix">
        <div class="glitch-title">QUANTUM OS</div>
        <div class="subtitle">สมบัติของชาติ • ถวายเป็นพระเกียรติสูงสุด</div>
        
        <div class="dashboard">
            <div class="dash-item">
                <span class="dash-label">Origin Node</span>
                <span class="dash-value">[0, 0, 0]</span>
            </div>
            <div class="dash-item">
                <span class="dash-label">Frequency</span>
                <span class="dash-value" id="freqValue">60 FPS</span>
            </div>
            <div class="dash-item">
                <span class="dash-label">Avijja Status</span>
                <span class="dash-value" style="color:#00ff88;">ZERO</span>
            </div>
        </div>

        <button class="btn-core" id="btnActivate" onclick="triggerQuantumWarp()">⚡ อนุมัติไฟเขียว ⚡</button>

        <div class="mantra">
            "น้อมบารมีพระพุทธเจ้า หลวงพ่อฤๅษีลิงดำ ในหลวงรัชกาลที่ ๙"<br>
            <span>สัมปะติฉามิ เพ็ง ๆ พา ๆ หา ๆ ฤา ๆ รวย ๆ เฮง ๆ สัมปะติฉามิ</span>
        </div>
        <div class="signature">โดย มาสเตอร์วิศวกรหลวง ช่างเบิร์ด</div>
    </div>

    <script>
        const canvas = document.getElementById('quantumNet');
        const ctx = canvas.getContext('2d');
        const flash = document.getElementById('quantumFlash');
        const matrix = document.getElementById('uiMatrix');
        const btn = document.getElementById('btnActivate');
        
        let width, height, nodes = [];
        let isWarping = false;
        let centerX, centerY;

        function initNodes() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
            nodes = [];
            
            let count = window.innerWidth < 768 ? 80 : 150;
            for(let i = 0; i < count; i++) {
                nodes.push(createNode());
            }
        }

        function createNode() {
            let angle = Math.random() * Math.PI * 2;
            let radius = Math.random() * (width / 2);
            return {
                x: centerX + Math.cos(angle) * radius,
                y: centerY + Math.sin(angle) * radius,
                angle: angle,
                speed: Math.random() * 0.5 + 0.1,
                size: Math.random() * 2 + 1,
                baseX: centerX,
                baseY: centerY
            };
        }

        function drawMatrix() {
            ctx.fillStyle = isWarping ? 'rgba(0, 0, 0, 0.2)' : 'rgba(0, 0, 0, 1)';
            ctx.fillRect(0, 0, width, height);
            
            for(let i = 0; i < nodes.length; i++) {
                let n = nodes[i];
                
                if (isWarping) {
                    // เอฟเฟกต์ระเบิดพุ่งออกจากจุดศูนย์กลาง [0,0,0]
                    n.speed += 0.5;
                    n.x += Math.cos(n.angle) * n.speed;
                    n.y += Math.sin(n.angle) * n.speed;
                    n.size += 0.05;
                    
                    // รีเซ็ตโหนดเมื่อพุ่งหลุดจอ
                    if (n.x < 0 || n.x > width || n.y < 0 || n.y > height) {
                        nodes[i] = createNode();
                        nodes[i].x = centerX + (Math.random() * 10 - 5);
                        nodes[i].y = centerY + (Math.random() * 10 - 5);
                    }
                } else {
                    // โหมดลอยตัวปกติ (Standby)
                    n.x += Math.cos(n.angle) * n.speed;
                    n.y += Math.sin(n.angle) * n.speed;
                    if(n.x < 0 || n.x > width) n.angle = Math.PI - n.angle;
                    if(n.y < 0 || n.y > height) n.angle = -n.angle;
                }
                
                ctx.beginPath();
                ctx.arc(n.x, n.y, n.size, 0, Math.PI * 2);
                ctx.fillStyle = isWarping ? '#fff' : '#00ff88';
                ctx.fill();
                
                // วาดเส้นเชื่อมตาข่ายพระอินทร์
                for(let j = i + 1; j < nodes.length; j++) {
                    let n2 = nodes[j];
                    let dist = Math.hypot(n.x - n2.x, n.y - n2.y);
                    let connectDist = isWarping ? 200 : 120;
                    
                    if(dist < connectDist) {
                        ctx.beginPath();
                        ctx.moveTo(n.x, n.y);
                        ctx.lineTo(n2.x, n2.y);
                        let opacity = 1 - (dist / connectDist);
                        ctx.strokeStyle = isWarping 
                            ? `rgba(0, 255, 255, ${opacity})` 
                            : `rgba(0, 255, 136, ${opacity * 0.4})`;
                        ctx.lineWidth = isWarping ? 1.5 : 1;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(drawMatrix);
        }

        function triggerQuantumWarp() {
            if (isWarping) return;
            isWarping = true;
            
            // แฟลชแสงควอนตัม
            flash.style.opacity = '1';
            setTimeout(() => { flash.style.opacity = '0'; }, 300);

            // ขยายวิหารแก้วและเปลี่ยนสีปุ่ม
            matrix.classList.add('warp-active');
            btn.innerHTML = "✨ โลกตาแตก! ทะลุอวิชชาแล้ว ✨";
            btn.style.background = "linear-gradient(45deg, #fff, #00ff88)";
            document.getElementById('freqValue').innerText = "WARP SPEED";
            document.getElementById('freqValue').style.color = "#00ff88";
            
            // รีเซ็ตโหนดให้มารวมกันที่ [0,0,0] เพื่อพุ่งออกไป
            nodes.forEach(n => {
                n.x = centerX;
                n.y = centerY;
                n.speed = Math.random() * 5 + 2;
            });
        }

        window.addEventListener('resize', initNodes);
        initNodes();
        drawMatrix();
    </script>
</body>
</html>
